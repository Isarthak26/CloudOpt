apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudopt-target
  namespace: cloudopt-lab
  labels:
    app.kubernetes.io/name: cloudopt-target
    app.kubernetes.io/part-of: cloudopt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudopt-target
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudopt-target
        app.kubernetes.io/part-of: cloudopt
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: target-app
          # Replace this with the immutable image digest pushed to your registry.
          image: CLOUDOPT_TARGET_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: cloudopt-target
  namespace: cloudopt-lab
  labels:
    app.kubernetes.io/name: cloudopt-target
    app.kubernetes.io/part-of: cloudopt
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudopt-target
  ports:
    - name: http
      port: 80
      targetPort: http
