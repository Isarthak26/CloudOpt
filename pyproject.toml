[project]
name = "cloudopt-ai"
version = "0.1.0"
description = "Measured cloud-resource decision support and evidence dashboard"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pandas>=2.2,<3.0",
]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["backend", ".", "target-app"]
testpaths = ["backend/tests", "ml/tests", "target-app/tests"]
